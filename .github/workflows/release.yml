name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  workflows: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout repository
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Floating Major Tag
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          VERSION=$(node -p "require('./package.json').version")
          MAJOR="v$(echo $VERSION | cut -d. -f1)"

          echo "Updating floating major tag: $MAJOR (Version: $VERSION)"

          # Eski referansı temizleyip yeni commit'e force push et
          git push origin ":refs/tags/$MAJOR" || true
          git tag -fa "$MAJOR" -m "Release $MAJOR"
          git push origin "$MAJOR" --force
